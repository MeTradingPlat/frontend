<div class="login-container">
  <!-- Forzar reactividad en modo Zoneless vinculando a la señal de idioma -->
  <span [hidden]="true">{{ i18nService.currentLocale() }}</span>

  <mat-card class="login-card" appearance="outlined">
    <mat-card-content>
      <img src="logo-isotipo.png" alt="MeTradingPlat" class="login-mark" />
      <h2>{{ 'AUTH.WELCOME' | translate }}</h2>
      <p class="subtitle">{{ 'AUTH.SUBTITLE' | translate }}</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'AUTH.USERNAME' | translate }}</mat-label>
          <input
            matInput
            type="text"
            formControlName="username"
            autocomplete="username"
            [placeholder]="'AUTH.USERNAME_PLACEHOLDER' | translate">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>{{ 'AUTH.PASSWORD' | translate }}</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
            [placeholder]="'AUTH.PASSWORD_PLACEHOLDER' | translate">
        </mat-form-field>

        <div *ngIf="errorMessage()" class="error-message">
          {{ errorMessage() | translate }}
        </div>

        <button mat-flat-button color="primary" type="submit" [disabled]="isLoading()" class="btn-submit">
          <mat-spinner *ngIf="isLoading()" diameter="20"></mat-spinner>
          <span *ngIf="!isLoading()">{{ 'AUTH.SUBMIT' | translate }}</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
